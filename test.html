<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Productos</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  >

  <link href="styles.css" rel="stylesheet">
</head>

<body>

  <main class="container py-5">

    <h1 class="mb-4">Productos</h1>

    <div
      id="productList"
      class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"
    >

      <!-- PRODUCTO 1 -->
      <div
        class="col product-card"
        data-id="1"
        data-name="Camiseta básica"
        data-price="19.99"
      >
        <article class="card h-100 shadow-sm">

          <div class="card-body d-flex flex-column">

            <h2 class="h5 card-title">
              Camiseta básica
            </h2>

            <p class="card-text text-muted">
              Prenda cómoda para todos los días.
            </p>

            <p class="fw-bold mt-auto mb-3">
              $19.99
            </p>

            <button
              class="add-to-cart btn btn-primary"
              type="button"
            >
              Añadir al carrito
            </button>

          </div>

        </article>
      </div>


      <!-- PRODUCTO 2 -->
      <div
        class="col product-card"
        data-id="2"
        data-name="Sudadera"
        data-price="34.50"
      >
        <article class="card h-100 shadow-sm">

          <div class="card-body d-flex flex-column">

            <h2 class="h5 card-title">
              Sudadera
            </h2>

            <p class="card-text text-muted">
              Tejido suave y diseño sencillo.
            </p>

            <p class="fw-bold mt-auto mb-3">
              $34.50
            </p>

            <button
              class="add-to-cart btn btn-primary"
              type="button"
            >
              Añadir al carrito
            </button>

          </div>

        </article>
      </div>


      <!-- PRODUCTO 3 -->
      <div
        class="col product-card"
        data-id="3"
        data-name="Gorra"
        data-price="12.00"
      >
        <article class="card h-100 shadow-sm">

          <div class="card-body d-flex flex-column">

            <h2 class="h5 card-title">
              Gorra
            </h2>

            <p class="card-text text-muted">
              Accesorio ligero para completar tu estilo.
            </p>

            <p class="fw-bold mt-auto mb-3">
              $12.00
            </p>

            <button
              class="add-to-cart btn btn-primary"
              type="button"
            >
              Añadir al carrito
            </button>

          </div>

        </article>
      </div>

    </div>


    <!-- IR AL CARRITO -->
    <div class="text-center mt-5">

      <a
        href="carrito.html"
        class="btn btn-success"
      >
        Ver carrito
      </a>

    </div>

  </main>


  <script src="carrito.js" defer></script>

</body>
</html>
