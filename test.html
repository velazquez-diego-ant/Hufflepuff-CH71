<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prueba del carrito</title>

    <!-- Hoja de estilos de Bootstrap desde CDN, sin instalar paquetes -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <div class="row justify-content-center g-4">
        <section class="col-12 col-lg-7">
          <h1 class="h3 mb-4">Productos</h1>

          <!-- carrito.js obtiene los datos de cada card mediante sus data-* -->
          <div id="productList" class="row row-cols-1 row-cols-md-2 g-3">
            <div
              class="col product-card"
              data-id="1"
              data-name="Camiseta básica"
              data-price="19.99"
            >
              <article class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                  <h2 class="h5 card-title">Camiseta básica</h2>
                  <p class="card-text text-muted">
                    Prenda cómoda para todos los días.
                  </p>
                  <p class="fw-bold mt-auto mb-3">$19.99</p>
                  <button class="add-to-cart btn btn-primary" type="button">
                    Añadir al carrito
                  </button>
                </div>
              </article>
            </div>

            <div
              class="col product-card"
              data-id="2"
              data-name="Sudadera"
              data-price="34.5"
            >
              <article class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                  <h2 class="h5 card-title">Sudadera</h2>
                  <p class="card-text text-muted">
                    Tejido suave y diseño sencillo.
                  </p>
                  <p class="fw-bold mt-auto mb-3">$34.50</p>
                  <button class="add-to-cart btn btn-primary" type="button">
                    Añadir al carrito
                  </button>
                </div>
              </article>
            </div>

            <div
              class="col product-card"
              data-id="3"
              data-name="Gorra"
              data-price="12"
            >
              <article class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                  <h2 class="h5 card-title">Gorra</h2>
                  <p class="card-text text-muted">
                    Accesorio ligero para completar tu estilo.
                  </p>
                  <p class="fw-bold mt-auto mb-3">$12.00</p>
                  <button class="add-to-cart btn btn-primary" type="button">
                    Añadir al carrito
                  </button>
                </div>
              </article>
            </div>
          </div>
        </section>

        <section class="col-12 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="h3 card-title mb-4">Carrito</h2>

              <!-- carrito.js inserta aqui los productos guardados -->
              <div id="cartList" class="vstack gap-3"></div>

              <button class="subtim btn btn-success w-100 mt-4" type="button">
                Finalizar compra
              </button>

              <!-- carrito.js escribe aqui la confirmacion de compra -->
              <p
                id="purchaseMessage"
                class="text-success fw-semibold mt-3 mb-0"
                role="status"
              ></p>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- defer carga el script despues de analizar el html -->
    <script src="carrito.js" defer></script>
  </body>
</html>
