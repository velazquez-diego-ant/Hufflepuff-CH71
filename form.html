<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>

<body>
    <header>
        <!--!ESTA PARTE NO LA TOCAMOS-->
    </header>
    <section>
        <!--! INFO DE LA PAGINA FORMULARIO/RECLUTAMIENTO-->
  <section class="bg-light">
    <!--! SECCION DE FORMULARIO Y CARDS EN LOCAL STORAGE-->
    <div class="container my-5">
        <h2 class="text-center mb-5 fw-bold">Registro de Admisión a Hogwarts ✨</h2>

        <div class="row g-4 justify-content-center">
            
            <!--? COLUMNA IZQUIERDA: FORMULARIO -->
            <div class="col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h3 class="card-title mb-4 text-primary">Carta de Reclutamiento</h3>

                        <form id="album-form" class="needs-validation" novalidate>
                            <!--? 1. Solicitud de nombre -->
                            <div class="mb-3">
                                <label for="nombre_estudiante" class="form-label">Nombre del Aspirante</label>
                                <input name="name" type="text" class="form-control" id="nombre_estudiante"
                                    placeholder="Ej. Newt Scamander" required>
                            </div>

                            <!--? 2. Elección de Casa de Hogwarts -->
                            <div class="mb-3">
                                <label for="casa" class="form-label">Casa a la que perteneces...</label>
                                <select name="casa" class="form-select" id="casa" required>
                                    <option value="" selected disabled>Elige tu casa...</option>
                                    <option value="Gryffindor">Gryffindor 🦁</option>
                                    <option value="Slytherin">Slytherin 🐍</option>
                                    <option value="Ravenclaw">Ravenclaw 🦅</option>
                                    <option value="Hufflepuff">Hufflepuff 🦡</option>
                                </select>
                            </div>

                            <!--? 3. Año/Grado academico -->
                            <div class="mb-3">
                                <label for="year" class="form-label">Qué año cursas en Hogwarts</label>
                                <input name="year" type="number" class="form-control" id="year"
                                    placeholder="Ej. 1 para primer año" min="1" max="7" required>
                            </div>

                            <!--? 4. Intereses (Checkboxes con IDs únicos) -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Cuéntanos, ¿Cuál es tu mayor interés por el que te reclutas?</label>
                            </div>
                            <div class="mb-2 form-check">
                                <input name="animal" type="checkbox" class="form-check-input" id="check-animal">
                                <label class="form-check-label" for="check-animal">¿Animales fantásticos?</label>
                            </div>
                            <div class="mb-2 form-check">
                                <input name="planta" type="checkbox" class="form-check-input" id="check-planta">
                                <label class="form-check-label" for="check-planta">¿Plantas mágicas?</label>
                            </div>
                            <div class="mb-4 form-check">
                                <input name="tienda" type="checkbox" class="form-check-input" id="check-tienda">
                                <label class="form-check-label" for="check-tienda">¿Nuestra grandiosa tienda?</label>
                            </div>

                            <!--? 5. Nivel de Vuelo -->
                            <div class="mb-3">
                                <label for="vuelo" class="form-label">Nivel de Vuelo en Escoba (0 al 10)</label>
                                <input name="vuelo" type="number" class="form-control" id="vuelo"
                                    placeholder="Ej. 9" min="0" max="10" required>
                            </div>


                        </form>
                    </div>
                </div>
            </div>



        </div>
    </div>
</section>
    <section>
        <!--! SECCION DE PREGUNTAS FRECUENTES-->
    </section>
    <footer>
        <!--! ESTA PARTE NO LA TOCAMOS-->
    </footer>
    <script src="form.js"></script>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
